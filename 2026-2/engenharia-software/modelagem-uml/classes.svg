<text x="1485" y="844" class="" text-anchor="start">0..* [P]</text>
<text x="1240" y="1090" class="label" text-anchor="start">Restricao: unico (pesquisa, identidade).</text>
<text x="1240" y="1125" class="label" text-anchor="start">Participacao nao referencia submissao.</text>
<text x="1240" y="1160" class="label" text-anchor="start">Token nao referencia resposta.</text>
<text x="1240" y="1195" class="label" text-anchor="start">Validade / reemissao: pendentes.</text>
<text x="45" y="1320" class="" text-anchor="start">Losango cheio = composição. [P] = escolha proposta. Todas as associações exigem validação do responsável.</text>
<text x="45" y="1355" class="" text-anchor="start">Questões fechadas usam opções; tipos e cardinalidade da seleção são pendentes. Categorias N:M são uma proposta.</text>
<text x="45" y="1390" class="" text-anchor="start">Não há associação entre Participacao/TokenIndividual e SubmissaoAnonima/Resposta. Separação não garante anonimato absoluto.</text>
